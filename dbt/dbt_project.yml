name: 'customer360'
version: '1.0.0'
config-version: 2

profile: 'customer360_postgres'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  customer360:
    # Staging models materialize as views
    staging:
      +materialized: view
    
    # Warehouse models materialize as tables (dim/fact)
    warehouse:
      +materialized: table
      
    # Analytics models (customer360) materialize as tables
    analytics:
      +materialized: table
