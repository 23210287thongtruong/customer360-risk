env {
  execution.parallelism = 2
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/opt/airflow/data/raw/transactions.csv"
    file_format_type = "csv"
    skip_header_row_number = 1
    field_delimiter = ","
    schema = {
      fields {
        transaction_id = string
        customer_id = string
        transaction_type = string
        amount = double
        timestamp = timestamp
        merchant_name = string
        merchant_category = string
        location_city = string
        location_state = string
        is_weekend = boolean
        hour = int
        is_online = boolean
        is_fraud = boolean
      }
    }
    result_table_name = "raw_transactions"
  }
}

transform {
  Sql {
    source_table_name = "raw_transactions"
    result_table_name = "transformed_transactions"
    query = "SELECT *, CURRENT_TIMESTAMP AS ingestion_timestamp FROM raw_transactions"
  }
}

sink {
  Jdbc {
    source_table_name = "transformed_transactions"
    url = "jdbc:postgresql://postgres:5432/customer360_dw"
    driver = "org.postgresql.Driver"
    user = "postgres"
    password = "postgres"
    database = "customer360_dw"
    table = "staging.transactions"
    primary_keys = ["transaction_id"]
    generate_sink_sql = true
  }
}
