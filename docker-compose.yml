services:
  # PostgreSQL Database (Data Warehouse) - Deployed on Master Node
  postgres:
    image: postgres:15
    container_name: customer360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer360_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - customer360-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer360_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      placement:
        constraints:
          - node.role == manager  # Run on master node
      resources:
        limits:
          memory: 2GB  # Leave 2GB for system on 4GB master
          cpus: '0.8'  # 80% of 1 vCPU
        reservations:
          memory: 1GB
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Apache Airflow Webserver - Master Node
  airflow-webserver:
    build: .
    image: customer360-airflow:latest
    container_name: customer360-airflow-webserver
    restart: unless-stopped
    user: root
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/customer360_dw
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      JAVA_HOME: '/usr/lib/jvm/default-java'
      # Data pipeline paths
      AIRFLOW_SCRIPTS_DIR: '/opt/airflow/scripts'
      AIRFLOW_DATA_DIR: '/opt/airflow/data/raw'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/data
      - ./scripts:/opt/airflow/scripts
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - customer360-network
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1GB  # Leave room for PostgreSQL
          cpus: '0.5'
        reservations:
          memory: 512MB
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Apache Airflow Scheduler - Worker Node
  airflow-scheduler:
    build: .
    image: customer360-airflow:latest
    container_name: customer360-airflow-scheduler
    restart: unless-stopped
    user: root
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/customer360_dw
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      JAVA_HOME: '/usr/lib/jvm/default-java'
      # Data pipeline paths
      AIRFLOW_SCRIPTS_DIR: '/opt/airflow/scripts'
      AIRFLOW_DATA_DIR: '/opt/airflow/data/raw'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/data
      - ./scripts:/opt/airflow/scripts
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - customer360-network
    deploy:
      placement:
        constraints:
          - node.role == worker  # Run on worker nodes
      resources:
        limits:
          memory: 2GB  # More memory for scheduler on worker
          cpus: '1.0'
        reservations:
          memory: 1GB
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3



  # Metabase (Dashboard) - Worker Node
  metabase:
    image: metabase/metabase:latest
    container_name: customer360-metabase
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: customer360_dw
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - customer360-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 2GB  # Metabase needs decent memory
          cpus: '0.8'
        reservations:
          memory: 1GB
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3


volumes:
  postgres_data:
    driver: local
  airflow_logs:
    driver: local
  airflow_plugins:
    driver: local
  metabase_data:
    driver: local

networks:
  customer360-network:
    driver: overlay
    attachable: true
