[project]
name = "customer360-risk"
version = "0.1.0"
description = "Customer 360 Risk Scoring Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=20.1.0",
    "pandas>=1.5.3",
    "numpy<2.0.0",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==1.4.49",
    "apache-airflow-providers-docker>=3.9.0",
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-env>=1.1.1",
    "black>=24.0.0",
    "ruff>=0.1.0",
]